<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Checkout</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f2f6;font:15px system-ui,sans-serif;color:#29212a}.wrap{max-width:480px;margin:40px auto;padding:22px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 30px #0001}h1{color:#cc0865}.value{font-size:32px;font-weight:800}.muted{color:#706675}.notice{padding:14px;background:#fff1da;border-radius:10px;margin:20px 0}.row{display:flex;justify-content:space-between;gap:12px;margin:14px 0;overflow-wrap:anywhere}button{width:100%;padding:15px;border:0;border-radius:12px;background:#d4086a;color:white;font-weight:700}button:disabled{opacity:.55}</style></head><body><main class="wrap"><div class="card"><h1>Pocket Checkout</h1><p class="muted">120xBet · Internal test balance</p><p id="state">Payment request যাচাই হচ্ছে…</p><div id="details" hidden><div class="row"><span>Amount</span><strong class="value" id="amount"></strong></div><div class="row"><span>Order</span><strong id="order"></strong></div><div class="row"><span>Status</span><strong id="status"></strong></div><div class="row"><span>Expires</span><strong id="expiry"></strong></div></div><div class="notice">নিরাপদ PIN/OTP এবং সার্ভার-সাইড Debit/Credit সংযোগ না হওয়া পর্যন্ত এই পেজ কোনো ব্যালেন্স কাটবে না।</div><button disabled>Pay — Not yet enabled</button></div></main><script>
'use strict';const API='https://pocket-payment-gateway.pocketwalletapp49.workers.dev';const $=id=>document.getElementById(id);const id=new URL(location.href).searchParams.get('intent');if(!id||!/^[0-9a-f]{8}-[0-9a-f-]{27,36}$/i.test(id))$('state').textContent='Valid payment intent দেওয়া হয়নি।';else fetch(API+'/v1/checkout/'+encodeURIComponent(id),{cache:'no-store'}).then(async r=>{const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'Payment request পাওয়া যায়নি');const p=j.intent||j.payment||j;const cents=Number(p.amount_minor??p.amountMinor);$('amount').textContent=Number.isSafeInteger(cents)&&cents>=0?'৳'+(cents/100).toFixed(2):'Unavailable';$('order').textContent=String(p.order_id??p.orderId??'—');$('status').textContent=String(p.status??'—');$('expiry').textContent=p.expires_at?new Date(p.expires_at>1e12?p.expires_at:p.expires_at*1000).toLocaleString('bn-BD'):'—';$('details').hidden=false;$('state').textContent='Payment request পাওয়া গেছে।';}).catch(e=>{$('state').textContent='Checkout load হয়নি: '+e.message});
</script></body></html>
